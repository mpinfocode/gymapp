# XcodeGen — spec del progetto Xcode dell'app iOS.
#
# Il progetto .xcodeproj NON è versionato: viene rigenerato da questo file
# (`xcodegen generate`) su GitHub Actions, dove avviene l'unica build iOS reale.
# Vedi docs/SPEC.md §1 (vincoli) e §3 (struttura), README.md (pipeline).
#
# Tutto il codice vive nel package locale `GymKit` (Package.swift nella root):
# questo target è volutamente un guscio sottile.

name: GymApp

options:
  minimumXcodeGenVersion: "2.42.0"
  createIntermediateGroups: true
  developmentLanguage: it
  generateEmptyDirectories: false
  groupSortPosition: top
  localPackagesGroup: Packages
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

# Package locale: la root del repo contiene Package.swift (prodotti GymCore/GymUI/GymFeatures).
packages:
  GymKit:
    path: .

# Impostazioni valide per tutto il progetto.
settings:
  # Ottimizzazioni ESPLICITE per Release: non ci si affida ai preset impliciti di XcodeGen.
  # Una Release non ottimizzata è ~20 volte più lenta (misurato sulla ricerca esercizi).
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      ENABLE_TESTABILITY: NO
      ENABLE_NS_ASSERTIONS: NO
      VALIDATE_PRODUCT: YES
  base:
    # Versione marketing fissa; il build number è sovrascritto dalla CI passando
    # CURRENT_PROJECT_VERSION=<n> sulla riga di comando di xcodebuild.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

    # Firma disabilitata: la CI produce un .app/.ipa NON firmato, che viene
    # poi ri-firmato sul Mac da Sideloadly/AltStore con un Apple ID gratuito.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  Gym:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: App
        excludes:
          - "Info.plist"

    dependencies:
      - package: GymKit
        product: GymFeatures

    settings:
      base:
        PRODUCT_NAME: Gym
        PRODUCT_BUNDLE_IDENTIFIER: it.mpinformatica.gymapp
        # Solo iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # L'Info.plist è quello generato qui sotto: nessuna generazione automatica da parte di Xcode.
        GENERATE_INFOPLIST_FILE: NO
        # Nel progetto non esiste nessun `#Preview`: il plugin macro non è
        # disponibile sul Mac di sviluppo (SPEC §1.2).
        ENABLE_PREVIEWS: NO

        # --- Firma: interruttore indiretto, spento per default ----------------
        # I cinque valori GYM_* qui sotto sono IDENTICI a quelli di
        # `settings.base`: con i default il target si comporta esattamente come
        # prima (nessuna firma) e la pipeline ios.yml non cambia di una virgola.
        #
        # Il workflow TestFlight accende la firma passando a xcodebuild SOLO le
        # variabili GYM_*, mai le CODE_SIGN_* vere. Motivo: qualsiasi setting
        # passato sulla riga di comando vale per TUTTI i target del build,
        # compresi quelli del package SPM locale (GymCore/GymUI/GymFeatures);
        # un CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM / PROVISIONING_PROFILE_*
        # globale è il modo classico di far fallire la compilazione dei target
        # SPM ("requires a development team", "profile doesn't match bundle id").
        # Le impostazioni di firma vere restano invece definite qui, cioè solo
        # sul target dell'app, dove servono.
        GYM_CODE_SIGN_STYLE: Manual
        GYM_CODE_SIGN_IDENTITY: ""
        GYM_DEVELOPMENT_TEAM: ""
        GYM_CODE_SIGNING_ALLOWED: NO
        GYM_CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: $(GYM_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(GYM_CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(GYM_DEVELOPMENT_TEAM)
        CODE_SIGNING_ALLOWED: $(GYM_CODE_SIGNING_ALLOWED)
        CODE_SIGNING_REQUIRED: $(GYM_CODE_SIGNING_REQUIRED)

    # Info.plist generato da XcodeGen a ogni `xcodegen generate`.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gym
        CFBundleName: Gym
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App solo-iOS: chiave attesa da App Store Connect nei bundle iPhone
        # (Xcode la mette da sempre nei template; qui l'Info.plist è scritto a
        # mano, quindi va dichiarata).
        LSRequiresIPhoneOS: true
        # Launch screen "vuoto": SwiftUI, nessuno storyboard, niente letterboxing.
        UILaunchScreen: {}
        # Ciclo di vita a scene. SwiftUI (`App` + `WindowGroup`) lo adotta già da
        # solo, ma dall'SDK di iOS 26 Apple lo dà per obbligatorio e Xcode genera
        # questa chiave per i target SwiftUI: dichiararla toglie ogni dubbio.
        # Nessuna `UISceneConfigurations`: la configurazione la fornisce SwiftUI.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Nessuna crittografia non esente → niente domande di export compliance.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Volutamente assente: UIBackgroundModes (nessuna attività in background).

schemes:
  Gym:
    build:
      targets:
        Gym: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
